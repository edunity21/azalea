<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>진달래꽃 감상수업 · 로그인</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{
    --paper:#F7F4F2;
    --ink:#1C1A1F;
    --ink-soft:#6B6570;
    --azalea:#A8326B;
    --azalea-pale:#F3E3EC;
    --line:#DFD8DC;
    --ok:#1F7A5C;
    --warn:#B4531A;
    --err:#B0243A;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    line-height:1.6;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px 16px;
    -webkit-font-smoothing:antialiased;
  }
  .card{
    width:100%;
    max-width:440px;
    background:#fff;
    border:1px solid var(--line);
    border-radius:4px;
  }
  .head{
    padding:36px 32px 28px;
    border-bottom:1px solid var(--line);
  }
  .eyebrow{
    font-size:11px;
    letter-spacing:.16em;
    color:var(--azalea);
    font-weight:600;
    margin-bottom:14px;
  }
  h1{
    font-size:27px;
    font-weight:700;
    letter-spacing:-.02em;
    line-height:1.3;
  }
  .sub{
    margin-top:10px;
    font-size:14px;
    color:var(--ink-soft);
  }
  .body{padding:28px 32px 32px}
  .signin{display:flex;justify-content:center;min-height:44px}
  .hint{
    margin-top:18px;
    font-size:13px;
    color:var(--ink-soft);
    text-align:center;
  }
  .hint b{color:var(--ink);font-weight:600}

  /* 결과 패널 */
  .result{display:none;margin-top:4px}
  .result.on{display:block}
  .banner{
    padding:14px 16px;
    border-radius:3px;
    font-size:14px;
    font-weight:600;
    margin-bottom:22px;
  }
  .banner.ok{background:#E8F3EF;color:var(--ok)}
  .banner.err{background:#FBE9EC;color:var(--err)}

  dl{display:grid;grid-template-columns:88px 1fr;gap:11px 14px;font-size:14px}
  dt{color:var(--ink-soft);font-size:13px}
  dd{word-break:break-all}
  dd .tag{
    display:inline-block;
    font-size:11px;
    font-weight:600;
    padding:1px 7px;
    border-radius:2px;
    margin-left:6px;
    vertical-align:1px;
  }
  .tag.pass{background:var(--azalea-pale);color:var(--azalea)}
  .tag.fail{background:#FBE9EC;color:var(--err)}

  .actions{margin-top:26px;display:flex;gap:8px}
  button{
    font-family:inherit;
    font-size:13.5px;
    font-weight:600;
    padding:10px 16px;
    border-radius:3px;
    cursor:pointer;
    border:1px solid var(--line);
    background:#fff;
    color:var(--ink);
    transition:background .15s;
  }
  button:hover{background:var(--paper)}
  button:focus-visible{outline:2px solid var(--azalea);outline-offset:2px}
  button.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
  button.primary:hover{background:#000}

  .note{
    margin-top:24px;
    padding-top:18px;
    border-top:1px solid var(--line);
    font-size:12.5px;
    color:var(--ink-soft);
  }
  code{
    font-family:ui-monospace,'SF Mono',Menlo,monospace;
    font-size:11.5px;
    background:var(--paper);
    padding:1px 5px;
    border-radius:2px;
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="card">
  <div class="head">
    <div class="eyebrow">음악 감상수업</div>
    <h1>진달래꽃, 여러 목소리로</h1>
    <p class="sub">학교 구글 계정으로 로그인하세요.</p>
  </div>

  <div class="body">
    <!-- 로그인 영역 -->
    <div id="signinArea">
      <div class="signin" id="gbtn"></div>
      <p class="hint"><b>@ai.jne.kr</b> 계정만 로그인됩니다.</p>
    </div>

    <!-- 결과 영역 -->
    <div class="result" id="result">
      <div class="banner" id="banner"></div>
      <dl>
        <dt>이름</dt><dd id="rName">—</dd>
        <dt>이메일</dt><dd id="rEmail">—</dd>
        <dt>소속</dt><dd id="rHd">—</dd>
        <dt>만료</dt><dd id="rExp">—</dd>
      </dl>
      <div class="actions">
        <button class="primary" id="btnCopy">토큰 복사</button>
        <button id="btnReset">다시 로그인</button>
      </div>
    </div>

    <p class="note">
      이 화면은 로그인이 정상 동작하는지 확인하는 단계입니다.
      성공하면 감상 페이지를 붙입니다.
    </p>
  </div>
</div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
const CLIENT_ID = '432757752918-5i46ftsts6163gtqvrulquiu0n0sklaq.apps.googleusercontent.com';
const ALLOWED_DOMAIN = 'ai.jne.kr';

let idToken = '';

function decodeJwt(token){
  const part = token.split('.')[1];
  const b64 = part.replace(/-/g,'+').replace(/_/g,'/');
  const bin = atob(b64);
  const bytes = Uint8Array.from(bin, c => c.charCodeAt(0));
  return JSON.parse(new TextDecoder('utf-8').decode(bytes));
}

function handleCredentialResponse(res){
  idToken = res.credential;
  let p;
  try{
    p = decodeJwt(idToken);
  }catch(e){
    showError('토큰을 읽지 못했습니다. 페이지를 새로고침한 뒤 다시 시도하세요.');
    return;
  }

  const domain = p.hd || (p.email || '').split('@')[1] || '';
  const allowed = domain === ALLOWED_DOMAIN;

  document.getElementById('rName').textContent  = p.name || '—';
  document.getElementById('rEmail').textContent = p.email || '—';
  document.getElementById('rHd').innerHTML =
    (domain || '없음') +
    '<span class="tag ' + (allowed ? 'pass">허용' : 'fail">차단') + '</span>';
  document.getElementById('rExp').textContent =
    p.exp ? new Date(p.exp * 1000).toLocaleTimeString('ko-KR') : '—';

  const banner = document.getElementById('banner');
  if(allowed){
    banner.className = 'banner ok';
    banner.textContent = '로그인 성공';
  }else{
    banner.className = 'banner err';
    banner.textContent = '학교 계정이 아닙니다 · ' + ALLOWED_DOMAIN + ' 계정으로 다시 로그인하세요';
  }

  document.getElementById('signinArea').style.display = 'none';
  document.getElementById('result').classList.add('on');
}

function showError(msg){
  const banner = document.getElementById('banner');
  banner.className = 'banner err';
  banner.textContent = msg;
  document.getElementById('result').classList.add('on');
}

window.addEventListener('load', () => {
  setTimeout(() => {
    if(!(window.google && google.accounts)){
      document.getElementById('gbtn').innerHTML =
        '<p style="font-size:13.5px;color:var(--err);text-align:center">' +
        '구글 로그인을 불러오지 못했습니다.<br>네트워크 차단 여부를 확인하세요.</p>';
      return;
    }
    google.accounts.id.initialize({
      client_id: CLIENT_ID,
      hd: ALLOWED_DOMAIN,
      callback: handleCredentialResponse,
      auto_select: false
    });
    google.accounts.id.renderButton(
      document.getElementById('gbtn'),
      { theme:'outline', size:'large', text:'signin_with', shape:'rectangular', locale:'ko', width:320 }
    );
  }, 700);
});

document.getElementById('btnCopy').addEventListener('click', e => {
  navigator.clipboard.writeText(idToken).then(() => {
    e.target.textContent = '복사됨';
    setTimeout(() => e.target.textContent = '토큰 복사', 1500);
  });
});

document.getElementById('btnReset').addEventListener('click', () => {
  google.accounts.id.disableAutoSelect();
  location.reload();
});
</script>

</body>
</html>
