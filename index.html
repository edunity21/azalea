<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>진달래꽃 감상수업 · 입장</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{
    --paper:#F7F4F2;
    --ink:#1C1A1F;
    --ink-soft:#6B6570;
    --ink-faint:#9A939F;
    --azalea:#A8326B;
    --azalea-pale:#F3E3EC;
    --line:#DFD8DC;
    --err:#B0243A;
    --err-bg:#FBE9EC;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    line-height:1.6;
    display:flex;align-items:center;justify-content:center;
    min-height:100vh;padding:24px 16px;
    -webkit-font-smoothing:antialiased;
  }
  .card{width:100%;max-width:440px;background:#fff;border:1px solid var(--line);border-radius:4px}
  .head{padding:32px 30px 24px;border-bottom:1px solid var(--line)}
  .eyebrow{font-size:11px;letter-spacing:.16em;color:var(--azalea);font-weight:600;margin-bottom:12px}
  h1{font-size:25px;font-weight:700;letter-spacing:-.02em;line-height:1.3}
  .sub{margin-top:9px;font-size:14px;color:var(--ink-soft)}
  .body{padding:26px 30px 30px}

  /* 1단계 · 구글 */
  .signin{display:flex;justify-content:center;min-height:44px}
  .hint{margin-top:16px;font-size:13px;color:var(--ink-soft);text-align:center}
  .hint b{color:var(--ink);font-weight:600}

  /* 2단계 */
  #step2{display:none}
  #step2.on{display:block}
  #step1.off{display:none}

  .who{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:11px 14px;background:var(--paper);border-radius:3px;
    font-size:13.5px;margin-bottom:22px;
  }
  .who span{color:var(--ink-soft)}
  .who b{font-weight:600;color:var(--ink)}
  .linkbtn{
    background:none;border:none;padding:0;font-family:inherit;font-size:12.5px;
    color:var(--azalea);cursor:pointer;text-decoration:underline;white-space:nowrap;
  }

  /* 역할 탭 */
  .tabs{display:grid;grid-template-columns:1fr 1fr;gap:0;margin-bottom:24px;border:1px solid var(--line);border-radius:3px;overflow:hidden}
  .tabs button{
    font-family:inherit;font-size:14px;font-weight:600;
    padding:11px;border:none;cursor:pointer;
    background:#fff;color:var(--ink-soft);
    transition:background .15s,color .15s;
  }
  .tabs button + button{border-left:1px solid var(--line)}
  .tabs button.sel{background:var(--ink);color:#fff}

  label{display:block;font-size:13px;font-weight:600;margin-bottom:7px}
  .field{margin-bottom:18px}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  input{
    width:100%;font-family:inherit;font-size:15px;color:var(--ink);
    background:#fff;border:1px solid var(--line);border-radius:3px;
    padding:11px 13px;transition:border-color .15s;
  }
  input:focus{outline:none;border-color:var(--azalea)}

  .go{
    width:100%;font-family:inherit;font-size:15px;font-weight:600;
    padding:13px;background:var(--ink);color:#fff;
    border:none;border-radius:3px;cursor:pointer;margin-top:4px;
    transition:background .15s;
  }
  .go:hover{background:#000}
  .go:focus-visible{outline:2px solid var(--azalea);outline-offset:2px}

  .msg{
    display:none;margin-bottom:18px;padding:12px 15px;
    background:var(--err-bg);color:var(--err);
    border-radius:3px;font-size:13.5px;font-weight:600;
  }
  .msg.on{display:block}

  .note{
    margin-top:22px;padding-top:16px;border-top:1px solid var(--line);
    font-size:12.5px;color:var(--ink-faint);
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="card">
  <div class="head">
    <div class="eyebrow">음악 감상수업</div>
    <h1>진달래꽃, 여러 목소리로</h1>
    <p class="sub" id="headSub">학교 구글 계정으로 로그인하세요.</p>
  </div>

  <div class="body">

    <!-- 1단계 · 구글 로그인 -->
    <div id="step1">
      <div class="signin" id="gbtn"></div>
      <p class="hint"><b>@ai.jne.kr</b> 계정만 입장할 수 있습니다.</p>
    </div>

    <!-- 2단계 · 역할 + 비밀번호 -->
    <div id="step2">
      <div class="who">
        <span><b id="whoName"></b> · <span id="whoMail"></span></span>
        <button class="linkbtn" id="btnOut">로그아웃</button>
      </div>

      <div class="tabs">
        <button id="tabS" class="sel">학생</button>
        <button id="tabT">교사</button>
      </div>

      <div class="msg" id="msg"></div>

      <!-- 학생 -->
      <div id="paneS">
        <div class="row">
          <div class="field">
            <label for="sid">학번</label>
            <input type="text" id="sid" placeholder="30115" inputmode="numeric" autocomplete="off" maxlength="6">
          </div>
          <div class="field">
            <label for="sname">이름</label>
            <input type="text" id="sname" placeholder="홍길동" autocomplete="off" maxlength="10">
          </div>
        </div>
        <div class="field">
          <label for="spw">학생용 비밀번호</label>
          <input type="password" id="spw" placeholder="비밀번호" autocomplete="off">
        </div>
        <button class="go" id="goS">입장하기</button>
      </div>

      <!-- 교사 -->
      <div id="paneT" style="display:none">
        <div class="field">
          <label for="tpw">교사용 비밀번호</label>
          <input type="password" id="tpw" placeholder="비밀번호" autocomplete="off">
        </div>
        <button class="go" id="goT">입장하기</button>
      </div>

      <p class="note">
        비밀번호는 수업용 출입문입니다. 보안장치가 아니므로
        학생에게 알려주어도 되는 수준으로만 쓰세요.
      </p>
    </div>

  </div>
</div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
/* ══ 설정 ══════════════════════════════════════ */
var CONFIG = {
  clientId:  '432757752918-5i46ftsts6163gtqvrulquiu0n0sklaq.apps.googleusercontent.com',
  domain:    'ai.jne.kr',
  studentPw: 'sp2026',
  teacherPw: 'po8286',
  nextPage:  'listen.html'
};
/* ═════════════════════════════════════════════ */

var $ = function(id){ return document.getElementById(id); };
var user = null;
var role = 'student';

function decodeJwt(token){
  var b64 = token.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');
  var bytes = Uint8Array.from(atob(b64), function(c){ return c.charCodeAt(0); });
  return JSON.parse(new TextDecoder('utf-8').decode(bytes));
}

function showMsg(t){ $('msg').textContent = t; $('msg').classList.add('on'); }
function clearMsg(){ $('msg').classList.remove('on'); }

/* ── 구글 로그인 ─────────────────────────── */
function handleCredentialResponse(res){
  var p;
  try { p = decodeJwt(res.credential); }
  catch(e){ alert('로그인 정보를 읽지 못했습니다. 새로고침 후 다시 시도하세요.'); return; }

  var dom = p.hd || String(p.email||'').split('@')[1];
  if (dom !== CONFIG.domain){
    alert('학교 계정(@' + CONFIG.domain + ')으로 로그인하세요.');
    if (window.google) google.accounts.id.disableAutoSelect();
    return;
  }

  user = { email: p.email, name: p.name || '', token: res.credential };
  $('whoName').textContent = user.name;
  $('whoMail').textContent = user.email;
  $('headSub').textContent = '구분을 고르고 비밀번호를 입력하세요.';
  $('step1').classList.add('off');
  $('step2').classList.add('on');
  $('sname').value = user.name;
  $('sid').focus();
}

window.addEventListener('load', function(){
  setTimeout(function(){
    if (!(window.google && google.accounts)){
      $('gbtn').innerHTML = '<p style="font-size:13.5px;color:var(--err);text-align:center">'
        + '구글 로그인을 불러오지 못했습니다.<br>새로고침해 보세요.</p>';
      return;
    }
    google.accounts.id.initialize({
      client_id: CONFIG.clientId,
      hd: CONFIG.domain,
      callback: handleCredentialResponse,
      auto_select: false
    });
    google.accounts.id.renderButton($('gbtn'),
      { theme:'outline', size:'large', text:'signin_with', shape:'rectangular', locale:'ko', width:320 });
  }, 600);
});

/* ── 역할 전환 ───────────────────────────── */
function setRole(r){
  role = r;
  var isS = (r === 'student');
  $('tabS').classList.toggle('sel', isS);
  $('tabT').classList.toggle('sel', !isS);
  $('paneS').style.display = isS ? 'block' : 'none';
  $('paneT').style.display = isS ? 'none' : 'block';
  clearMsg();
  setTimeout(function(){ (isS ? $('sid') : $('tpw')).focus(); }, 30);
}
$('tabS').addEventListener('click', function(){ setRole('student'); });
$('tabT').addEventListener('click', function(){ setRole('teacher'); });

/* ── 세션 저장 후 이동 ───────────────────── */
function enter(session){
  try {
    sessionStorage.setItem('azalea_user', JSON.stringify(session));
  } catch(e){
    /* 저장이 막힌 환경이면 주소로 넘깁니다 */
    location.href = CONFIG.nextPage + '?role=' + session.role;
    return;
  }
  location.href = CONFIG.nextPage;
}

/* ── 학생 입장 ───────────────────────────── */
$('goS').addEventListener('click', function(){
  var sid  = $('sid').value.trim();
  var name = $('sname').value.trim();
  var pw   = $('spw').value;

  if (!sid)  { showMsg('학번을 입력하세요.'); $('sid').focus(); return; }
  if (!/^\d{4,6}$/.test(sid)) { showMsg('학번은 숫자로만 입력하세요. (예: 30115)'); $('sid').focus(); return; }
  if (!name) { showMsg('이름을 입력하세요.'); $('sname').focus(); return; }
  if (pw !== CONFIG.studentPw){ showMsg('학생용 비밀번호가 맞지 않습니다.'); $('spw').select(); return; }

  clearMsg();
  enter({
    role: 'student',
    email: user.email,
    googleName: user.name,
    studentId: sid,
    name: name,
    token: user.token,
    at: Date.now()
  });
});

/* ── 교사 입장 ───────────────────────────── */
$('goT').addEventListener('click', function(){
  var pw = $('tpw').value;
  if (pw !== CONFIG.teacherPw){ showMsg('교사용 비밀번호가 맞지 않습니다.'); $('tpw').select(); return; }

  clearMsg();
  enter({
    role: 'teacher',
    email: user.email,
    name: user.name,
    token: user.token,
    at: Date.now()
  });
});

/* Enter 키로도 입장 */
['sid','sname','spw'].forEach(function(id){
  $(id).addEventListener('keydown', function(e){ if(e.key==='Enter') $('goS').click(); });
});
$('tpw').addEventListener('keydown', function(e){ if(e.key==='Enter') $('goT').click(); });

/* ── 로그아웃 ───────────────────────────── */
$('btnOut').addEventListener('click', function(){
  try { sessionStorage.removeItem('azalea_user'); } catch(e){}
  if (window.google) google.accounts.id.disableAutoSelect();
  location.reload();
});
</script>

</body>
</html>
